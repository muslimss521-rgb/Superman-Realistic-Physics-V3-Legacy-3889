name: Build Superman ASI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Release
        shell: cmd
        run: msbuild Superman.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: Superman-ASI
          path: bin/Superman.asi
