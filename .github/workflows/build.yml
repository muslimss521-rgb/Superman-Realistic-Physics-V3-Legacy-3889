name: Build Superman ASI
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: msbuild Superman.vcxproj /p:Configuration=Release /p:Platform=x64
      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item bin/Superman.asi artifact/Superman.asi
          Copy-Item config/Superman.ini artifact/Superman.ini
      - uses: actions/upload-artifact@v4
        with:
          name: Superman-Realistic-Physics-V3-Legacy-3889
          path: artifact/
