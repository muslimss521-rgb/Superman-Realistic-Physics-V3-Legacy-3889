name: Build Superman ASI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild Superman.vcxproj /p:Configuration=Release /p:Platform=x64 /m
      - name: Verify
        shell: pwsh
        run: |
          if (!(Test-Path "bin\Superman.asi")) { throw "Superman.asi was not produced" }
          Get-Item "bin\Superman.asi"
      - uses: actions/upload-artifact@v4
        with:
          name: Superman-Legacy-3889
          path: bin/Superman.asi
