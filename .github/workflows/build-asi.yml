name: Build Superman ASI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild Superman.vcxproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Verify
        shell: pwsh
        run: |
          if (!(Test-Path "bin\Superman.asi")) {
            Write-Error "Superman.asi was not produced."
          }
          Get-Item "bin\Superman.asi" | Format-List Name,Length,FullName

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "bin\Superman.asi" "artifact\Superman.asi"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Superman-Legacy-3889-v01
          path: artifact\Superman.asi
